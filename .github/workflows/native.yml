name: native
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: graalvm
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
      - run: ./build-native
      - name: Smoke test initialize
        run: |
          echo '{"jsonrpc":"2.0","id":0,"method":"initialize","params":{"protocol_version":0,"encoding":"json","core_version":"0.0.0"}}' \
            | ./mimiron | grep -q '"protocol_version":0'
      - uses: actions/upload-artifact@v4
        with:
          name: mimiron
          path: |
            mimiron
            mimiron.json
